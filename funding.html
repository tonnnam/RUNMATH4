  "fdTagLoan": "สินเชื่อ",

  "fdPrep4": "ตรวจคุณสมบัติและเงื่อนไขล่าสุดที่เว็บไซต์ทางการของแต่ละที่",
  "fdLinkTools": "ลองคำนวณตัวเลขธุรกิจ",
  "fdLinkIdea": "ตรวจไอเดียด้วย AI"
});
    Object.assign(translations.en, {
  "navFunding": "Funding",
  "fdTitle": "Funding and support programs",
  "fdSubtitle": "Agencies offering loans, guarantees, grants and benefits for Thai SMEs and startups",
  "fdNote": "Compiled from public sources, some based on 2023-2024 news. Amounts, conditions and application windows change often, so always check the official website.",
  "fdTagLoan": "Loans",
  "fdTagGuarantee": "Guarantee",
  "fdTagGrant": "Grants / co-investment",
  "fdTagTax": "Tax / benefits",
  "fdTagInfo": "Info & policy",
  "fdVisit": "Visit website",
  "fdPrepTitle": "Before applying, you generally need",
  "fdPrep1": "Up-to-date business information and income/expense figures",
  "fdPrep2": "A plan for how you will use the money and pay it back",
  "fdPrep3": "Business registration documents and a bank account",
  "fdPrep4": "To check current eligibility and terms on each official website",
  "fdLinkTools": "Run your business numbers",
  "fdLinkIdea": "Check your idea with AI"
});

    const ORGS = [
      { name: 'SME D Bank (ธพว.)', url: 'https://www.smebank.co.th', tag: 'Loan',
        th: 'ธนาคารของรัฐที่ให้สินเชื่อแก่ SME ดูผลิตภัณฑ์และเงื่อนไขล่าสุดที่เว็บไซต์',
        en: 'State-owned bank lending to SMEs. See current products and terms on its website.' },
      { name: 'บสย. (TCG)', url: 'https://www.tcg.or.th', tag: 'Guarantee',
        th: 'ค้ำประกันสินเชื่อให้ SME ที่ขาดหลักทรัพย์ค้ำ ใช้ร่วมกับสินเชื่อจากสถาบันการเงิน',
        en: 'Credit guarantee for SMEs that lack collateral, used together with loans from financial institutions.' },
      { name: 'depa', url: 'https://www.depa.or.th', tag: 'Grant',
        th: 'ส่งเสริมเศรษฐกิจดิจิทัล มีโครงการบ่มเพาะและกองทุน Digital Startup Fund แบบร่วมลงทุนมีเงื่อนไข ผู้สมัครต้องผ่านการรับรองจากหน่วยงานที่กำหนด เช่น NIA, depa, NSTDA',
        en: 'Digital economy agency with accelerator programs and the Digital Startup Fund (conditional co-investment). Applicants must be certified by designated agencies such as NIA, depa or NSTDA.' },
      { name: 'NIA', url: 'https://www.nia.or.th', tag: 'Grant',

        en: 'Government innovation agency with startup support covering funding, incubation and networking.' },
      { name: 'Startup Thailand', url: 'https://govsupport.startupthailand.org/en/home', tag: 'Info',
        th: 'รวมข้อมูลการสนับสนุนจากภาครัฐสำหรับสตาร์ทอัปไว้ในที่เดียว',
        en: 'A single place listing government support available to startups.' },
      { name: 'BOI', url: 'https://www.boi.go.th', tag: 'Tax',
        th: 'ส่งเสริมการลงทุน ให้สิทธิประโยชน์ด้านภาษี และเคยประกาศโครงการทุนจับคู่สำหรับสตาร์ทอัปศักยภาพสูง (กรกฎาคม 2567) ตรวจเงื่อนไขล่าสุดก่อนสมัคร',
        en: 'Investment promotion with tax benefits, and a matching-fund scheme for high-potential startups announced in July 2024. Check current terms before applying.' },
      { name: 'สสว. (OSMEP)', url: 'https://www.sme.go.th', tag: 'Info',
        th: 'สำนักงานส่งเสริมวิสาหกิจขนาดกลางและขนาดย่อม ศูนย์กลางนโยบายและโครงการสนับสนุน SME',
        en: 'Office of SMEs Promotion, the central body for SME policy and support programs.' }
    ];
    const TAGS = { Loan: 'fdTagLoan', Guarantee: 'fdTagGuarantee', Grant: 'fdTagGrant', Tax: 'fdTagTax', Info: 'fdTagInfo' };
    const list = document.getElementById('fundList');

    function render() {
      const lang = Lib.lang() === 'en' ? 'en' : 'th';
      list.innerHTML = ORGS.map(o => `
        <section class="section-card fund-card">
          <div class="card-head"><h3>${Lib.esc(o.name)}</h3><span class="tag">${Lib.esc(getTranslation(TAGS[o.tag]))}</span></div>
          <p>${Lib.esc(o[lang])}</p>
          <a class="nav-link" href="${Lib.esc(o.url)}" target="_blank" rel="noopener noreferrer">${Lib.esc(getTranslation('fdVisit'))}</a>
        </section>`).join('');
    }
    document.getElementById('languageSelect').addEventListener('change', render);
    render();
  </script>
