<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math4Startup: AI-Powered Financial Decision Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>
<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="index.html">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
        <rect width="28" height="28" rx="7" fill="#15203A"/>
        <path d="M5 20 L23 8" stroke="#FFD23F" stroke-width="3" stroke-linecap="round"/>
        <path d="M5 11 L23 19" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      </svg>
      Math4Startup
    </a>
    <nav class="main-nav" aria-label="Main">
        <a href="analyze.html" data-i18n="navFinance">การเงิน</a>
        <a href="advisor.html" data-i18n="navAdvisor">ที่ปรึกษา AI</a>
      </nav>
      <div class="lang">
      <select id="languageSelect" onchange="setLanguage(this.value)" aria-label="Language">
        <option value="th" data-i18n="langThai">ไทย</option>
        <option value="en" data-i18n="langEnglish">English</option>
      </select>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div>
      <h1 data-i18n="heroTitle">Math4Startup: AI-Powered Financial Decision Engine</h1>
      <p class="hero-sub" data-i18n="heroSubtitle">เริ่มต้นด้วยการเลือกสินค้าที่คุณสนใจ หรือดูแนวโน้มสินค้าขายดีในตลาด</p>

      <div class="start">
        <label for="productName" data-i18n="labelProduct">ชื่อสินค้าหรือธุรกิจคุณสนใจ</label>
        <div class="start-row">
          <input class="field" type="text" id="productName" placeholder="เช่น กาแฟ, เสื้อผ้า, คอร์สออนไลน์" data-i18n-placeholder="productPlaceholder">
          <button class="btn" onclick="startAnalysis()" data-i18n="btnStart">เริ่มต้นวิเคราะห์ธุรกิจ</button>
        </div>
      </div>
    </div>

    <figure class="sheet hero-chart" aria-hidden="true">
      <svg viewBox="0 0 480 360">
        <polygon class="zone" points="40,250 215,206 40,320" fill="#D9482B" fill-opacity=".16"/>
        <polygon class="zone" points="215,206 440,150 440,60" fill="#0B7A55" fill-opacity=".18"/>
        <g stroke="#15203A" stroke-width="2" stroke-linecap="round">
          <line x1="40" y1="20" x2="40" y2="320"/>
          <line x1="40" y1="320" x2="460" y2="320"/>
        </g>
        <line class="draw" pathLength="1" x1="40" y1="250" x2="440" y2="150" stroke="#D9482B" stroke-width="4" stroke-linecap="round"/>
        <line class="draw" pathLength="1" x1="40" y1="320" x2="440" y2="60" stroke="#0B7A55" stroke-width="4" stroke-linecap="round"/>
        <g class="bep">
          <line x1="215" y1="215" x2="215" y2="320" stroke="#15203A" stroke-width="1.5" stroke-dasharray="4 5"/>
          <circle cx="215" cy="206" r="9" fill="#FFD23F" stroke="#15203A" stroke-width="2.5"/>
          <text x="215" y="347" text-anchor="middle" font-family="Prompt, sans-serif" font-weight="600" font-size="16" fill="#15203A">BEP</text>
        </g>
      </svg>
    </figure>
  </section>

  <section class="trending">
    <div class="section-head">
      <h2 data-i18n="trendingTitle">ธุรกิจแนะนำในช่วงนี้จาก AI</h2>
      <button class="ghost-btn" id="refreshBtn" onclick="refreshTrending()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
        <span data-i18n="refreshBtn">รีเฟรชข้อมูล</span>
      </button>
    </div>
    <ol class="trend-list" id="trendingGrid"><!-- ข้อมูลจะถูกโหลดด้วย JavaScript --></ol>
  </section>
</main>

<script src="i18n.js"></script>
<script>

const fallbackTrends = [
  "กาแฟคั่วสด", "เสื้อผ้าออนไลน์", "คอร์สออนไลน์", "อาหารคลีน", "ขนมหวาน",
  "เครื่องสำอาง", "ผลิตภัณฑ์ธรรมชาติ", "เสื้อผ้าเด็ก", "อุปกรณ์ออกกำลังกาย", "บริการส่งอาหาร"
];

const grid = document.getElementById('trendingGrid');
const refreshBtn = document.getElementById('refreshBtn');
const productInput = document.getElementById('productName');

function getLang() { return localStorage.getItem("language") || "th"; }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function showSkeleton() {
  grid.innerHTML = '<li class="skeleton"></li>'.repeat(10);
}

async function loadTrendingProductsFromAPI() {
  refreshBtn.disabled = true;
  showSkeleton();
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 10000);
  try {
    const response = await fetch('https://pytrends-api-qu8c.onrender.com//api/trends', { signal: controller.signal });
    const data = await response.json();

    if (!data.trends || data.trends.length === 0) throw new Error("ไม่มีข้อมูล trends");
    renderTrends(data.trends.slice(0, 10));
  } catch (error) {
    console.error("❌ โหลดเทรนด์ล้มเหลว:", error);
    renderTrends(fallbackTrends);
  } finally {
    clearTimeout(timer);
    refreshBtn.disabled = false;
  }
}

function renderTrends(trendList) {
  grid.innerHTML = trendList.map((name, index) => `
    <li>
      <button type="button" class="trend-row" data-name="${escapeHtml(name)}">
        <span class="rank">${index + 1}</span>
        <span class="name">${escapeHtml(name)}</span>
      </button>
    </li>
  `).join('');
}

grid.addEventListener('click', e => {
  const row = e.target.closest('.trend-row');
  if (row) selectProduct(row.dataset.name, row);
});

function selectProduct(productName, row) {
  productInput.value = productName;
  grid.querySelectorAll('.trend-row.is-selected').forEach(el => el.classList.remove('is-selected'));
  if (row) row.classList.add('is-selected');
  const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  productInput.scrollIntoView({ behavior: calm ? 'auto' : 'smooth', block: 'center' });
  productInput.focus({ preventScroll: true });
}

function refreshTrending() {
  loadTrendingProductsFromAPI();
}

function startAnalysis() {
  const lang = getLang();
  const productName = productInput.value.trim();
  if (!productName) {
    const alertMsg = lang === "th" ? "กรุณากรอกชื่อสินค้าหรือบริการ" : "Please enter product or service name";
    alert(alertMsg);
    return;
  }
  localStorage.setItem('selectedProduct', productName);
  window.location.href = 'form.html';
}

productInput.addEventListener('keydown', e => { if (e.key === 'Enter') startAnalysis(); });
document.getElementById('languageSelect').value = getLang();

// เรียกตอนโหลดหน้า
loadTrendingProductsFromAPI();
</script>
</body>

</html>
