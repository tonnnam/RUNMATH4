<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>กรอกข้อมูลธุรกิจ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="site-header">
    <div class="wrap bar">
      <a class="brand" href="index.html">
        <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
          <rect width="28" height="28" rx="7" fill="#15203A"/>
          <path d="M5 20 L23 8" stroke="#FFD23F" stroke-width="3" stroke-linecap="round"/>
          <path d="M5 11 L23 19" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        </svg>
        Math4Startup
      </a>
      <nav class="main-nav" aria-label="Main">
        <a href="overview.html" data-i18n="navOverview">ภาพรวม</a>
        <a href="trends.html" data-i18n="navTrends">เทรนด์</a>
        <a href="news.html" data-i18n="navNews">ข่าว</a>
        <a href="tools.html" data-i18n="navTools">เครื่องมือ</a>
        <a href="funding.html" data-i18n="navFunding">แหล่งทุน</a>
        <a href="advisor.html" data-i18n="navAdvisor">ที่ปรึกษา AI</a>
      </nav>
      <div class="lang">
        <select id="languageSelect" onchange="setLanguage(this.value)" aria-label="Language">
          <option value="th" data-i18n="langThai">ไทย</option>
          <option value="en" data-i18n="langEnglish">English</option>
        </select>
      </div>
    </div>
  </header>

  <main class="wrap narrow">
    <div class="page-head">
      <h1 data-i18n="form_title">กรอกข้อมูลสั้นๆ</h1>
      <p data-i18n="form_subtitle">เพียง 5 ข้อมูลสำคัญ ก็วิเคราะห์ธุรกิจได้แล้ว!</p>
    </div>

    <div class="selected">
      <span data-i18n="selected_product">สินค้าที่เลือก:</span>
      <strong id="selectedProductName">-</strong>
    </div>

    <p class="note" data-i18n="quick_note">ใส่ข้อมูลง่ายๆ 5 ข้อ ระบบจะช่วยวิเคราะห์ให้เอง!</p>

    <div class="sheet form-sheet">
      <form id="businessForm" novalidate>

        <div class="form-group">
          <label for="productName"><span data-i18n="label_product">1. ชื่อสินค้า/บริการ</span> <span class="required">*</span></label>
          <input class="field" type="text" id="productName" required placeholder="เช่น กาแฟคั่วสด">
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="cost"><span data-i18n="label_cost">2. ต้นทุนต่อหน่วย (บาท)</span> <span class="required">*</span></label>
            <div class="affix"><span>฿</span><input class="field" type="number" id="cost" step="0.01" required placeholder="เช่น 15" data-i18n-placeholder="costPlaceholder"></div>
            <div class="help-text" data-i18n="help_text_cost">ค่าวัตถุดิบ + ค่าแรง</div>
          </div>

          <div class="form-group">
            <label for="price"><span data-i18n="label_price">3. ราคาขายต่อหน่วย (บาท)</span> <span class="required">*</span></label>
            <div class="affix"><span>฿</span><input class="field" type="number" id="price" step="0.01" required placeholder="เช่น 25" data-i18n-placeholder="pricePlaceholder"></div>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="units"><span data-i18n="label_units">4. จำนวนที่จะขายต่อเดือน (หน่วย)</span> <span class="required">*</span></label>
            <input class="field" type="number" id="units" required placeholder="เช่น 500" data-i18n-placeholder="unitsPlaceholder">
          </div>

          <div class="form-group">
            <label for="expense"><span data-i18n="label_expense">5. ค่าใช้จ่ายคงที่ต่อเดือน (บาท)</span> <span class="required">*</span></label>
            <div class="affix"><span>฿</span><input class="field" type="number" id="expense" step="0.01" required placeholder="เช่น 3000" data-i18n-placeholder="expensePlaceholder"></div>
            <div class="help-text" data-i18n="help_text">ค่าเช่า + ค่าไฟ + เงินเดือน</div>
          </div>
        </div>

        <button type="submit" class="btn btn-block" data-i18n="btn_submit">เริ่มวิเคราะห์เลย!</button>
      </form>
    </div>

    <a href="index.html" class="back" data-i18n="back_home">← กลับหน้าแรก</a>
  </main>

  <script>
    // โหลดชื่อสินค้าที่เลือกจากหน้าแรก
    const selectedProduct = localStorage.getItem('selectedProduct');
    if (selectedProduct) {
      document.getElementById('selectedProductName').textContent = selectedProduct;
      document.getElementById('productName').value = selectedProduct;
    }

    const getLang = () => localStorage.getItem('language') || 'th';
    const markInvalid = (el, bad) => el.classList.toggle('is-invalid', bad);

    // เอาสีแดงออกทันทีเมื่อเริ่มพิมพ์แก้
    document.querySelectorAll('#businessForm .field').forEach(el =>
      el.addEventListener('input', () => markInvalid(el, false)));

    document.getElementById('businessForm').addEventListener('submit', function (e) {
      e.preventDefault();

      // ตรวจสอบข้อมูลที่จำเป็น
      const requiredFields = ['productName', 'cost', 'price', 'units', 'expense'];
      let isValid = true;

      requiredFields.forEach(fieldId => {
        const field = document.getElementById(fieldId);
        const empty = !field.value.trim();
        markInvalid(field, empty);
        if (empty) isValid = false;
      });

      if (!isValid) {
        const message = getLang() === 'th' ? 'กรุณากรอกข้อมูลให้ครบถ้วน' : 'Please fill in all required fields';
        alert(message);
        return;
      }
      // ตรวจสอบว่าราคาขายมากกว่าต้นทุนหรือไม่
      const cost = parseFloat(document.getElementById('cost').value);
      const price = parseFloat(document.getElementById('price').value);

      if (price <= cost) {
        const message = getLang() === 'th' ? '❗ ราคาขายต้องมากกว่าต้นทุน' : '❗ Selling price must be higher than cost';
        alert(message);
        markInvalid(document.getElementById('price'), true);
        document.getElementById('price').focus();
        return; // หยุดการส่งฟอร์ม
      }

      // รวบรวมข้อมูล
      const businessData = {
        productName: document.getElementById('productName').value,
        cost: parseFloat(document.getElementById('cost').value),
        price: parseFloat(document.getElementById('price').value),
        units: parseFloat(document.getElementById('units').value),
        expense: parseFloat(document.getElementById('expense').value),

        // ค่าดีฟอลต์สำหรับข้อมูลอื่นๆ
        businessType: 'retail',
        productDescription: 'ไม่ได้ระบุ',
        initialCapital: 0,
        workingCapital: 0,
        targetMarket: 'ลูกค้าทั่วไป',
        salesChannel: 'both',
        competitorCount: 'moderate',
        advantage: 'คุณภาพดี',
        employeeCount: 1,
        businessLocation: 'home',
        businessDuration: 'new',
        revenueGoal: 0,
        createdAt: new Date().toISOString()
      };

      // บันทึกข้อมูล
      localStorage.setItem('businessData', JSON.stringify(businessData));

      // ไปหน้าวิเคราะห์
      window.location.href = 'analyze.html';
    });

  </script>

  <script src="i18n.js"></script>
</body>

</html>
